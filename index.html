<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fcfbf9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)">
    <title>Новий допис</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    
    <!-- Підключення стильних шрифтів: Newsreader (текст/заголовок) та Plus Jakarta Sans (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body, :fullscreen, ::backdrop {
            background-color: #fcfbf9; /* Теплий паперовий колір */
            color: #222222;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 20px;
            line-height: 1.75;
            padding: max(20px, env(safe-area-inset-top)) 20px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background-color: #e8e4dc;
            color: #111;
        }

        main {
            width: 100%;
            max-width: 680px;
            margin-top: 60px; 
        }

        .title-input {
            width: 100%;
            font-family: 'Newsreader', Georgia, serif;
            font-size: 44px;
            font-weight: 600;
            letter-spacing: -0.02em;
            border: none;
            outline: none;
            margin-bottom: 28px;
            color: #111111;
            background: transparent;
            line-height: 1.25;
        }

        .title-input::placeholder {
            color: #e0dcd5;
            font-weight: 400;
        }

        .editor {
            width: 100%;
            min-height: 400px;
            font-family: 'Newsreader', Georgia, serif;
            font-size: 20px;
            font-weight: 400;
            border: none;
            outline: none;
            color: #2c2c2c;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding-bottom: 180px;
            background: transparent;
        }

        .editor:empty:before {
            content: attr(data-placeholder);
            color: #b5b0a6;
            cursor: text;
            font-style: italic;
        }

        .ui-element {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        .counter {
            position: fixed;
            bottom: 36px;
            left: 40px;
            font-size: 13px;
            color: #a39e93;
            font-weight: 400;
            user-select: none;
            pointer-events: none;
            letter-spacing: 0.2px;
            transition: color 0.3s ease;
        }

        .bottom-controls {
            position: fixed;
            bottom: 32px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        .status-message {
            font-size: 13px;
            color: #888888;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            user-select: none;
        }

        .status-message.show {
            opacity: 1;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: #777268;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: transform 0.2s ease, color 0.2s ease, background-color 0.2s ease;
        }

        .icon-btn:hover {
            color: #111111;
            background-color: rgba(0, 0, 0, 0.04);
        }

        .publish-btn:hover {
            transform: translateX(3px);
        }

        .icon-btn:disabled {
            color: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .sound-btn.muted {
            opacity: 0.4;
        }

        @media (prefers-color-scheme: dark) {
            html, body, :fullscreen, ::backdrop {
                background-color: #161617;
                color: #e1e1e1;
            }

            ::selection {
                background-color: #333336;
                color: #fff;
            }

            .title-input {
                color: #f0f0f0;
            }

            .title-input::placeholder {
                color: #343438;
            }

            .editor {
                color: #d8d8d8;
            }

            .editor:empty:before {
                color: #4a4a4e;
            }

            .counter {
                color: #55555a;
            }

            .icon-btn {
                color: #88888e;
            }

            .icon-btn:hover {
                color: #f0f0f0;
                background-color: rgba(255, 255, 255, 0.05);
            }

            .status-message {
                color: #88888e;
            }
        }
    </style>
</head>
<body>

    <main>
        <input type="text" id="post-title" class="title-input" placeholder="Заголовок" autofocus>
        <div id="post-body" class="editor" contenteditable="true" data-placeholder="Почніть писати свою історію тут..."></div>
    </main>

    <div id="counter" class="counter ui-element">0 слів</div>

    <div class="bottom-controls ui-element" id="controls-area">
        <span id="status" class="status-message">Надсилання...</span>
        
        <!-- Кнопка увімкнення/вимкнення звуку -->
        <button id="sound-toggle" class="icon-btn sound-btn" onclick="toggleSound()" aria-label="Перемикач звуку" title="Звук клавіатури">
            <svg id="sound-icon-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="sound-icon-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
        </button>

        <!-- Кнопка публікації -->
        <button id="publish-btn" class="icon-btn publish-btn" onclick="publishPost()" aria-label="Опублікувати" title="Опублікувати">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </div>

    <script>
        const titleInput = document.getElementById('post-title');
        const bodyDiv = document.getElementById('post-body');
        const publishBtn = document.getElementById('publish-btn');
        const statusText = document.getElementById('status');
        const counterText = document.getElementById('counter');
        const soundToggleBtn = document.getElementById('sound-toggle');
        const soundIconOn = document.getElementById('sound-icon-on');
        const soundIconOff = document.getElementById('sound-icon-off');

        // === СИНТЕЗАТОР ЗВУКІВ ДРУКУ (Web Audio API) ===
        let audioCtx = null;
        let isSoundEnabled = localStorage.getItem('sound_enabled') !== 'false';

        function updateSoundUI() {
            if (isSoundEnabled) {
                soundIconOn.style.display = 'block';
                soundIconOff.style.display = 'none';
                soundToggleBtn.classList.remove('muted');
            } else {
                soundIconOn.style.display = 'none';
                soundIconOff.style.display = 'block';
                soundToggleBtn.classList.add('muted');
            }
        }

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            localStorage.setItem('sound_enabled', isSoundEnabled);
            updateSoundUI();
        }

        function playKeySound(key) {
            if (!isSoundEnabled) return;

            // Ініціалізація AudioContext при першому натисканні
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            // Створення генератора шуму (для тактильного клацання)
            const bufferSize = audioCtx.sampleRate * 0.02; // 20мс тривалість
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            // Фільтр тонкої настройки звуку
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';

            // Налаштування тону під різні клавіші
            if (key === 'Enter') {
                filter.frequency.setValueAtTime(450, now); // Глибокий стук
                filter.Q.setValueAtTime(2.0, now);
            } else if (key === ' ') {
                filter.frequency.setValueAtTime(650, now); // М'який пробіл
                filter.Q.setValueAtTime(3.0, now);
            } else if (key === 'Backspace') {
                filter.frequency.setValueAtTime(1200, now); // Вищий глухий клац
                filter.Q.setValueAtTime(4.0, now);
            } else {
                // Випадкова міні-варіація частоти для природності друку
                const randomFreq = 850 + (Math.random() * 150 - 75);
                filter.frequency.setValueAtTime(randomFreq, now);
                filter.Q.setValueAtTime(5.0, now);
            }

            // Обвідна гучності (Gain Envelope)
            const gain = audioCtx.createGain();
            const volume = (key === 'Enter' || key === ' ') ? 0.18 : 0.12;
            
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start(now);
        }

        // Прослуховування натискань клавіш для звуку
        const handleKeyDown = (e) => {
            // Ігноруємо системні комбінації типу Ctrl+C, Cmd+R
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            playKeySound(e.key);
        };

        titleInput.addEventListener('keydown', handleKeyDown);
        bodyDiv.addEventListener('keydown', handleKeyDown);

        // === LOCALSTORAGE ===
        document.addEventListener('DOMContentLoaded', () => {
            const savedTitle = localStorage.getItem('draft_title');
            const savedBody = localStorage.getItem('draft_body');

            if (savedTitle) titleInput.value = savedTitle;
            if (savedBody) bodyDiv.innerHTML = savedBody;

            updateCounter();
            updateSoundUI();
        });

        titleInput.addEventListener('input', () => {
            localStorage.setItem('draft_title', titleInput.value);
        });

        bodyDiv.addEventListener('input', () => {
            localStorage.setItem('draft_body', bodyDiv.innerHTML);
            updateCounter();
        });

        function clearDraft() {
            localStorage.removeItem('draft_title');
            localStorage.removeItem('draft_body');
            titleInput.value = '';
            bodyDiv.innerHTML = '';
            updateCounter();
        }

        // === ЛІЧИЛЬНИК ===
        function updateCounter() {
            const text = bodyDiv.innerText.trim();
            const words = text ? text.split(/\s+/).length : 0;
            const readingTime = Math.max(1, Math.ceil(words / 180));

            if (words === 0) {
                counterText.innerText = '0 слів';
                return;
            }

            let wordString = 'слів';
            const lastDigit = words % 10;
            const lastTwoDigits = words % 100;

            if (lastDigit === 1 && lastTwoDigits !== 11) {
                wordString = 'слово';
            } else if (lastDigit >= 2 && lastDigit <= 4 && (lastTwoDigits < 10 || lastTwoDigits >= 20)) {
                wordString = 'слова';
            }

            counterText.innerText = `${words} ${wordString} · ~${readingTime} хв читання`;
        }

        // === ГАРЯЧІ КЛАВІШІ ===
        bodyDiv.addEventListener('keydown', (e) => {
            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const modifier = isMac ? e.metaKey : e.ctrlKey;

            if (modifier && e.key.toLowerCase() === 'b') {
                e.preventDefault();
                document.execCommand('bold', false, null);
            }
            if (modifier && e.key.toLowerCase() === 'i') {
                e.preventDefault();
                document.execCommand('italic', false, null);
            }
        });

        // === КОНВЕРТАЦІЯ ТА РОЗБИТТЯ НА ЧАСТИНИ ===
        function convertToTelegramChunks(title, bodyHTML) {
            const temp = document.createElement('div');
            temp.innerHTML = bodyHTML;

            const escapeHTML = (str) => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            function serialize(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    return node.nodeValue.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                }
                if (node.nodeType !== Node.ELEMENT_NODE) {
                    return '';
                }

                const tagName = node.tagName.toLowerCase();
                const childrenHtml = Array.from(node.childNodes).map(serialize).join('');

                if (tagName === 'b' || tagName === 'strong') {
                    return `<b>${childrenHtml}</b>`;
                }
                if (tagName === 'i' || tagName === 'em') {
                    return `<i>${childrenHtml}</i>`;
                }
                if (tagName === 'br') {
                    return '\n';
                }
                if (tagName === 'div' || tagName === 'p') {
                    return `\n${childrenHtml}`;
                }
                return childrenHtml;
            }

            const paragraphs = Array.from(temp.childNodes)
                .map(node => serialize(node).trim())
                .filter(p => p.length > 0);

            const chunks = [];
            let currentChunk = '';
            const MAX_LIMIT = 4000; 

            if (title.trim()) {
                currentChunk += `<b>${escapeHTML(title.trim())}</b>\n\n`;
            }

            for (let para of paragraphs) {
                if (para.length > MAX_LIMIT) {
                    if (currentChunk.trim()) {
                        chunks.push(currentChunk.trim());
                        currentChunk = '';
                    }
                    let remaining = para;
                    while (remaining.length > 0) {
                        const subChunk = remaining.substring(0, MAX_LIMIT);
                        chunks.push(subChunk.trim());
                        remaining = remaining.substring(MAX_LIMIT);
                    }
                } else {
                    const separator = currentChunk ? '\n\n' : '';
                    if (currentChunk.length + separator.length + para.length > MAX_LIMIT) {
                        if (currentChunk.trim()) {
                            chunks.push(currentChunk.trim());
                        }
                        currentChunk = para;
                    } else {
                        currentChunk += separator + para;
                    }
                }
            }

            if (currentChunk.trim()) {
                chunks.push(currentChunk.trim());
            }

            return chunks;
        }

        // === ПУБЛІКАЦІЯ ===
        async function publishPost() {
            const title = titleInput.value.trim();
            const bodyHTML = bodyDiv.innerHTML;

            if (!title && !bodyDiv.innerText.trim()) return;

            publishBtn.disabled = true;
            statusText.innerText = 'Надсилання...';
            statusText.classList.add('show');

            const chunks = convertToTelegramChunks(title, bodyHTML);

            try {
                const response = await fetch('/api/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chunks })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusText.innerText = 'Опубліковано';
                    clearDraft();
                    
                    setTimeout(() => {
                        statusText.classList.remove('show');
                    }, 3000);
                } else {
                    throw new Error(data.error || 'Помилка надсилання');
                }
            } catch (error) {
                console.error(error);
                statusText.innerText = 'Помилка';
                alert('Не вдалося опублікувати: ' + error.message);
                setTimeout(() => {
                    statusText.classList.remove('show');
                }, 4000);
            } finally {
                publishBtn.disabled = false;
            }
        }

        // Повноекранний режим
        document.addEventListener('dblclick', function(event) {
            const controls = document.getElementById('controls-area');
            const isClickInsideInput = titleInput.contains(event.target) || event.target === titleInput;
            const isClickInsideBody = bodyDiv.contains(event.target) || event.target === bodyDiv;
            const isClickInsideControls = controls.contains(event.target) || event.target === controls;

            if (!isClickInsideInput && !isClickInsideBody && !isClickInsideControls) {
                toggleFullscreen();
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn(`Повноекранний режим недоступний: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
